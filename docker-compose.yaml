services:
  postgres:
    image: postgres:15-alpine
    container_name: wedone_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: wedone_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wedone_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: